    <script>
        dayjs.extend(dayjs_plugin_customParseFormat);

        const tituloOriginal = document.title;

        document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            document.title = "👀 ¡Oye, vuelve a trabajar!";
        } else {
            document.title = tituloOriginal;
        }
        });
        
        const logoutIcon = document.getElementById('log_out');

        document.getElementById("log_out").addEventListener("click", async () => {
            try {
                const BASE_URL = window.location.origin;

                const config = await fetch(`${BASE_URL}/php/config.php`).then((r) => r.json());

                const IP_LOCAL = config.IP_LOCAL;

                const response = await fetch(`http://${IP_LOCAL}:3000/logout`, {
                method: "POST",
                credentials: "include",
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.removeItem("dbUser");
                    window.location.href = "/";
                } else {
                    toastr("No se pudo cerrar sesión", "Oops...")
                }
            } catch (error) {
                console.error("Error al hacer la solicitud:", error);
                toastr("Sucedio un error desconocido en la solicitud", "Oops...")
            }
        });

        $(".open-modal-glossary").on("click", function() {
            $(".modal-glossary").addClass("opacity-100 z-[9990]").removeClass("opacity-0 -z-[9990]")

            Motion.animate('.modal-glossary-overlay', {
                opacity: [0, 1],
            }, {
                duration: 0.25,
                easing: 'linear'
            })

            Motion.animate('.modal-glossary-container', {
                opacity: [0, 1],
                scale: [0.7, 1.05, 1]
            }, {
                duration: 0.45,
                easing: 'ease-out'
            })
        })
        
        $(".modal-glossary-overlay").on("click", async function() {
            const anim = Motion.animate('.modal-glossary-container', {
                opacity: [1, 0],
                scale: [1, 1.05, 0.7]
            }, {
                duration: 0.45,
                easing: 'ease-in'
            })

            await anim.finished;

            $(".modal-glossary").removeClass("opacity-100 z-[9990]").addClass("opacity-0 -z-[9990]")
        })
    </script>
