server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.php index.html;

    location / {
        # Intenta en este orden:
        # 1. archivo exacto
        # 2. carpeta
        # 3. .php
        # 4. .html
        # 5. 404
        try_files $uri $uri/ $uri.php $uri.html /404.php;
    }

    # Procesar PHP (solo si realmente usas PHP)
    location ~ \.php$ {
        fastcgi_pass php:9000; # o 127.0.0.1:9000 según tu setup
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}