<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Tair</title>
    <script
      src="https://kit.fontawesome.com/4f92527fbc.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Gescon</title>
    <link rel="icon" href="./public/img/favicon.webp" type="image/webp" />
    <!-- TOASTR -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
    />
    <!-- BOOTSTRAP ICON -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- JQUERY -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- AXIOS -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- TAILWINDCSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="w-full h-screen grid grid-cols-2">
      <div class="w-full h-full flex justify-center items-center bg-[#f5f5f5]">
        <form
          id="loginForm"
          class="w-full max-w-xs bg-white !rounded-xl border border-gray-100 shadow-sm !px-4 !py-6 flex flex-col gap-2"
        >
          <h1 class="text-3xl font-medium text-center">Inicio de sesión</h1>
          <span class="text-sm text-gray-400 text-center"
            >Escriba sus datos para ingresar al sistema</span
          >
          <!-- USUARIO -->
          <div class="input flex flex-col w-full relative">
            <input
              id="dbUser"
              name="dbUser"
              type="text"
              placeholder="Ingrese su usuario"
              class="peer order-2 w-full border-gray-300 !px-[10px] !py-[11px] text-sm bg-white border-2 rounded-[5px] focus:outline-none focus:border-blue-500 placeholder:text-black/25"
              required
            />
            <label
              for="dbUser"
              class="order-1 text-gray-500 text-sm font-semibold relative top-2 ml-[7px] px-[3px] bg-white w-fit transition-colors peer-focus:text-blue-500"
            >
              Usuario(*)
            </label>
          </div>

          <!-- CONTRASEÑA -->
          <div class="input flex flex-col w-full relative">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Ingrese su contraseña"
              class="peer order-2 w-full border-gray-300 !px-[10px] !py-[11px] text-sm bg-white border-2 rounded-[5px] focus:outline-none focus:border-blue-500 placeholder:text-black/25"
              required
            />
            <label
              for="password"
              class="order-1 text-gray-500 text-sm font-semibold relative top-2 ml-[7px] px-[3px] bg-white w-fit transition-colors peer-focus:text-blue-500"
            >
              Contraseña(*)
            </label>

            <button
              type="button"
              class="absolute z-10 top-[calc(50%+10px)] right-2 -translate-y-1/2 cursor-pointer text-gray-600 peer-focus:text-blue-500"
              id="btn-view-pass"
            >
              <i class="bi bi-eye-fill"></i>
            </button>
          </div>

          <button
            id="btn-submit"
            type="submit"
            class="w-full bg-blue-800 text-white text-sm !py-2 rounded-lg cursor-pointer hover:bg-blue-600 transition-colors flex justify-center items-center gap-1 disabled:bg-gray-400 disabled:cursor-auto"
          >
            Ingresar
            <div
              id="loader"
              class="hidden w-3 h-3 border-2 border-t-gray-300 border-transparent rounded-full animate-spin"
            ></div>
          </button>
        </form>
      </div>
      <figure class="w-full h-full">
        <img
          src="./public/img/gescon-3.webp"
          alt="Gescon"
          class="w-full h-full object-cover object-center"
        />
      </figure>
    </div>

    <!-- TOASTR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <!-- END TOASTR -->
    <script src="./js/login.js"></script>
    <script>
      const btnSubmit = document.getElementById("btn-submit");
      const btnViewPass = document.getElementById("btn-view-pass");
      const inputPassword = document.getElementById("password");

      let onLoad = 0;

      function showLoader() {
        onLoad++;
        $("#loader").addClass("flex");
        $("#loader").removeClass("hidden");
        btnSubmit.disabled = true;
      }

      function hideLoader() {
        onLoad--;
        if (onLoad <= 0) {
          $("#loader").removeClass("flex");
          $("#loader").addClass("hidden");
          btnSubmit.disabled = false;
        }
      }

      btnViewPass.addEventListener("click", function () {
        if (inputPassword.type === "password") {
          inputPassword.type = "text";
          btnViewPass.innerHTML = `<i class="bi bi-eye-slash-fill"></i>`;
        } else {
          inputPassword.type = "password";
          btnViewPass.innerHTML = `<i class="bi bi-eye-fill"></i>`;
        }
      });

      const setErrors = (message, field, isError = true) => {
        if (isError) {
          field.classList.add("invalid");
          field.nextElementSibling.classList.add("error");
          field.nextElementSibling.innerText = message;
        } else {
          field.classList.remove("invalid");
          field.nextElementSibling.classList.remove("error");
          field.nextElementSibling.innerText = "";
        }
      };

      const validateEmptyField = (message, e) => {
        const field = e.target;
        const fieldValue = e.target.value;
        if (fieldValue.trim().length === 0) {
          setErrors(message, field);
        } else {
          setErrors("", field, false);
        }
      };
      const validateEmailFormat = (e) => {
        const field = e.target;
        const fieldValue = e.target.value;
        const regex = new RegExp(/^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/);
        if (fieldValue.trim().length > 5 && !regex.test(fieldValue)) {
          setErrors("Correo invalido", field);
        } else {
          setErrors("", field, false);
        }
      };

      document.addEventListener("DOMContentLoaded", function () {
        document
          .getElementById("loginForm")
          .addEventListener("submit", async function (e) {
            e.preventDefault(); // Prevenir el envío del formulario  #004f83

            showLoader();

            const dbUser = document.getElementById("dbUser").value;
            const password = document.getElementById("password").value;

            try {
              const IP_LOCAL = await obtenerConfig();

              const response = await fetch(`http://${IP_LOCAL}:3000/login`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ dbUser, password }),
                credentials: "include",
              });

              const data = await response.json();
              if (data.success) {
                toastr.success(data.message, "Bienvenido");
                localStorage.setItem("dbUser", dbUser);

                if(data.permissions.includes("ver_dashboard")) {
                  setTimeout(() => {
                    window.location.href = "/gescon/";
                  }, 1500);
                } else {
                  setTimeout(() => {
                    window.location.href = "/gescon/sistema";
                  }, 1500);
                }
                
              } else {
                toastr.warning(data.message, "Oops...");
              }
            } catch (error) {
              console.error("Error al hacer la solicitud:", error);
              toastr.error(
                "Sucedio un error desconocido en su solicitud",
                "Oops...",
              );
              hideLoader();
            }

            setTimeout(() => {
              hideLoader();
            }, 1500);
          });
      });
    </script>
  </body>
</html>
